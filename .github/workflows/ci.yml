name: SysHealth-Pro CI

# Manual on-demand execution only (zero automatic runner minute consumption)
on:
  workflow_dispatch:

jobs:
  lint-and-validate:
    name: Code Integrity & Syntax Check
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Python Syntax
        run: |
          python -m compileall -q .
